name: Build and Push Custom Bootc Image

on:
  schedule:
    # Runs automatically every day at 07:00 UTC
    - cron: '0 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinoite-nic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Fast 2-second inline disk wipe (replaces 3-minute jlumbroso action)
      - name: Free Disk Space (Fast Wipe)
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /var/lib/docker

      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Reconstruct your sbctl keys from secrets
      - name: Reconstruct sbctl keys from GitHub Secrets
        run: |
          echo "${{ secrets.SBCTL_DB_KEY }}" | base64 -d > sbctl_db.key
          echo "${{ secrets.SBCTL_DB_CERT }}" | base64 -d > sbctl_db.pem
          echo "${{ secrets.SBCTL_DB_DER }}" | base64 -d > sbctl_db.der

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build raw image with secret mounts attached and tag as :raw
      - name: Build Raw Image with Podman
        run: |
          podman build \
            --format=oci \
            --secret id=sbctl_db_key,src=sbctl_db.key \
            --secret id=sbctl_db_cert,src=sbctl_db.pem \
            --secret id=sbctl_db_der,src=sbctl_db.der \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:raw \
            .

      # 4. Re-chunk the signed raw image with Chunkah
      - name: Optimize Layers with Chunkah
        run: |
          RAW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:raw"
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          export CHUNKAH_CONFIG_STR="$(podman inspect ${RAW_IMAGE})"
          mkdir -p /tmp/chunkah-out

          # Run Chunkah with bootc label stripping & hardlink preservation
          podman run --rm \
            --mount=type=image,src=${RAW_IMAGE},target=/chunkah \
            -v /tmp/chunkah-out:/out:Z \
            -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah:latest build \
            --prune /sysroot/ \
            --label ostree.final-diffid- \
            --max-layers 128 \
            -t ${TARGET_IMAGE} \
            -o /out/chunked.tar

          # Load optimized image into Podman storage
          podman load -i /tmp/chunkah-out/chunked.tar
          rm -rf /tmp/chunkah-out

          # Tag with the commit SHA
          podman tag ${TARGET_IMAGE} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5. Push final chunked images to GHCR
      - name: Push Chunked Image to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6. Always clean up sensitive key files from runner workspace
      - name: Clean up keys
        if: always()
        run: |
          rm -f sbctl_db.key sbctl_db.pem sbctl_db.der
