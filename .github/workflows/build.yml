name: Build and Push Custom Bootc Image

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinoite-nic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /var/lib/docker

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image with Podman
        run: |
            podman build \
                --target chunkah \
                --timestamp 0 \
                -v $(pwd):/run/src:rw,z \
                . && \
            podman build \
                --target final \
                --format=oci \
                --timestamp 0 \
                --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                .

      - name: Push Image to GHCR
        run: |
          podman push --compression-format zstd --compression-level 9 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push --compression-format zstd --compression-level 9 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
