name: Build and Push Custom Bootc Image

on:
  schedule:
    # Runs automatically every day at 07:00 UTC
    - cron: '0 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinoite-nic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Fast Wipe)
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /var/lib/docker

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct MOK keys from GitHub Secrets
        run: |
          echo "${{ secrets.MOK_KEY }}" | base64 -d > mok.key
          echo "${{ secrets.MOK_CRT }}" | base64 -d > mok.crt
          echo "${{ secrets.MOK_DER }}" | base64 -d > mok.der

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 1 - Build Rootfs and Generate Chunked OCI
        run: |
          podman build \
            -f Containerfile.rootfs \
            --secret id=mok_key,src=mok.key \
            --secret id=mok_crt,src=mok.crt \
            --secret id=mok_der,src=mok.der \
            .

      - name: Step 2 - Build Final Image from Chunked OCI
        run: |
          podman build \
            -f Containerfile \
            --format=oci \
            --secret id=mok_key,src=mok.key \
            --secret id=mok_crt,src=mok.crt \
            --secret id=mok_der,src=mok.der \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push Image to GHCR
        run: |
          podman push --compression-format zstd:chunked ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push --compression-format zstd:chunked ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


      - name: Clean up keys
        if: always()
        run: |
          rm -f mok.key mok.crt mok.der
