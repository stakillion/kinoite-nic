name: Build and Push Custom Bootc Image

on:
  schedule:
    # Runs automatically every day at 07:00 UTC
    - cron: '0 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinoite-nic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct sbctl keys from GitHub Secrets
        run: |
          echo "${{ secrets.SBCTL_DB_KEY }}" | base64 -d > sbctl_db.key
          echo "${{ secrets.SBCTL_DB_CERT }}" | base64 -d > sbctl_db.pem
          echo "${{ secrets.SBCTL_DB_DER }}" | base64 -d > sbctl_db.der

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Podman
        run: |
          podman build \
            --secret id=sbctl_db_key,src=sbctl_db.key \
            --secret id=sbctl_db_cert,src=sbctl_db.pem \
            --secret id=sbctl_db_der,src=sbctl_db.der \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push image to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Clean up keys
        if: always()
        run: |
          rm -f sbctl_db.key sbctl_db.pem sbctl_db.der
